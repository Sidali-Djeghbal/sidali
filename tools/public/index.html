<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Tools — Sidali DJEGHBAL</title>
		<meta
			name="description"
			content="A curated set of tools I use daily: Docmost, Vaultwarden, Notion, Gmail and my reading list."
		/>
		<meta name="theme-color" content="#000000" />
		<link
			rel="icon"
			href="https://sidali-djeghbal.dev/static/favicons/favicon-32x32.png"
			type="image/png"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&family=Mukta:wght@200;300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/styles.css" />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('tools-theme');
					var dark = stored ? stored === 'dark' : true;
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="splash">
			<button
				id="theme-toggle"
				type="button"
				aria-label="Toggle dark mode"
				title="Toggle dark mode"
				data-skip-splash-cursor
			></button>

			<header class="page">
				<p class="kicker">Tools</p>
				<h1>My workspace, in one place.</h1>
				<p class="subtitle">
					Everything I use — notes, docs, passwords, mail and books.
				</p>
			</header>

			<main id="tools" class="page"></main>

			<footer class="page">
				<a
					href="https://sidali-djeghbal.dev"
					target="_blank"
					rel="noreferrer"
					data-skip-splash-cursor
					class="underline-magical"
					>Sidali DJEGHBAL</a
				>
			</footer>
		</div>

		<script src="/app.js"></script>
	</body>
</html>
