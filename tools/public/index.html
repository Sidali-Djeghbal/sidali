<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Tools — Sidali DJEGHBAL</title>
		<meta
			name="description"
			content="My personal command center — bookmarks, tasks, habits and books."
		/>
		<meta name="robots" content="noindex, nofollow" />
		<meta name="theme-color" content="#000000" />
		<link
			rel="icon"
			href="https://sidali-djeghbal.dev/static/favicons/favicon-32x32.png"
			type="image/png"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&family=Mukta:wght@200;300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/styles.css" />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('tools-theme');
					var dark = stored ? stored === 'dark' : true;
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="login-view" class="login-view hidden">
			<div class="login-card">
				<p class="kicker">Tools</p>
				<h1>Command center</h1>
				<p class="subtitle">Enter your password to unlock.</p>
				<form id="login-form" novalidate>
					<div class="field">
						<label for="login-password">Password</label>
						<input
							id="login-password"
							class="input"
							type="password"
							name="password"
							autocomplete="current-password"
							autofocus
						/>
					</div>
					<p id="login-error" class="form-error hidden"></p>
					<button class="btn primary" type="submit">Unlock</button>
				</form>
			</div>
		</div>

		<div id="app-view" class="hidden">
			<header class="topbar">
				<div class="topbar-inner">
					<button
						id="back-btn"
						class="icon-btn"
						type="button"
						aria-label="Back to launcher"
					></button>
					<span id="topbar-title" class="topbar-title"></span>
					<div class="topbar-actions">
						<button
							id="logout-btn"
							class="icon-btn"
							type="button"
							aria-label="Lock and sign out"
							title="Lock"
						></button>
						<button
							id="theme-toggle"
							class="icon-btn"
							type="button"
							aria-label="Toggle dark mode"
							title="Toggle dark mode"
						></button>
					</div>
				</div>
			</header>
			<main id="view"></main>
		</div>

		<div id="modal-root"></div>
		<div id="toast-root" class="toast-root" aria-live="polite"></div>

		<script src="/app.js"></script>
	</body>
</html>
