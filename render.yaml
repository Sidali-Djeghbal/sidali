# Render Blueprint for Docmost (self-hosted, free tier)
# Deploys the official docmost/docmost Docker image; Postgres is external
# (Supabase), Redis is a Render Key Value instance, file storage is
# Cloudflare R2 (S3 driver).
#
# Why Render Key Value instead of Upstash: Docmost's parseRedisUrl() ignores
# the rediss:// protocol (docmost/docmost#1681), so it cannot use TLS-only
# providers like Upstash. Render's Key Value speaks plain redis://.
#
# Usage:
#   1. Complete the steps in docmost-setup.md first (R2 bucket + API token,
#      Supabase Postgres). Skip the Upstash step.
#   2. Push this file to your repo, then Render -> New -> Blueprint Instance,
#      pick this repo, and set the marked env vars (sync: false) in the
#      Dashboard before the first deploy.

services:
  - type: web
    name: docmost
    runtime: image
    image:
      url: docmost/docmost:latest
    plan: free
    healthCheckPath: /api/health

    envVars:
      # --- Public/static values (safe to commit) ---
      - key: APP_URL
        value: https://docmost.sidali-djeghbal.dev
      - key: PORT
        value: '3000'
      - key: STORAGE_DRIVER
        value: s3
      - key: AWS_S3_REGION
        value: auto
      - key: AWS_S3_BUCKET
        value: docmost
      # Cloudflare R2 S3 endpoint (account id shown below)
      - key: AWS_S3_ENDPOINT
        value: https://0e8ab63bb93128b57f4f47ad32f95988.r2.cloudflarestorage.com
      - key: AWS_S3_FORCE_PATH_STYLE
        value: 'true'
      - key: DISABLE_TELEMETRY
        value: 'true'

      # --- Generated once at deploy ---
      - key: APP_SECRET
        generateValue: true

      # --- Secrets: fill these in the Render Dashboard before first deploy ---
      - key: DATABASE_URL
        sync: false
      # --- Redis: Render Key Value (no TLS, works with Docmost) ---
      - key: REDIS_URL
        fromService:
          name: redis
          type: keyvalue
          property: connectionString
      - key: AWS_S3_ACCESS_KEY_ID
        sync: false
      - key: AWS_S3_SECRET_ACCESS_KEY
        sync: false

  - type: keyvalue
    name: redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
