# Render Blueprint for Docmost (self-hosted, free tier)
# Deploys the official docmost/docmost Docker image; Postgres + Redis are
# external (Supabase / Upstash), file storage is Cloudflare R2 (S3 driver).
#
# Usage:
#   1. Complete the steps in docmost-setup.md first (R2 bucket + API token,
#      Supabase Postgres, Upstash Redis).
#   2. Push this file to your repo, then Render -> New -> Blueprint Instance,
#      pick this repo, and set the marked env vars (sync: false) in the
#      Dashboard before the first deploy.

services:
  - type: web
    name: docmost
    runtime: image
    image: docmost/docmost:latest
    plan: free
    healthCheckPath: /api/health

    envVars:
      # --- Public/static values (safe to commit) ---
      - key: APP_URL
        value: https://docmost.sidali-djeghbal.dev
      - key: PORT
        value: '3000'
      - key: STORAGE_DRIVER
        value: s3
      - key: AWS_S3_REGION
        value: auto
      - key: AWS_S3_BUCKET
        value: docmost
      # Cloudflare R2 S3 endpoint (account id shown below)
      - key: AWS_S3_ENDPOINT
        value: https://0e8ab63bb93128b57f4f47ad32f95988.r2.cloudflarestorage.com
      - key: AWS_S3_FORCE_PATH_STYLE
        value: 'true'
      - key: DISABLE_TELEMETRY
        value: 'true'

      # --- Generated once at deploy ---
      - key: APP_SECRET
        generateValue: true

      # --- Secrets: fill these in the Render Dashboard before first deploy ---
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AWS_S3_ACCESS_KEY_ID
        sync: false
      - key: AWS_S3_SECRET_ACCESS_KEY
        sync: false
